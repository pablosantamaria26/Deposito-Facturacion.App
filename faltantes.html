<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Faltantes · Mercado Limpio</title>
<meta name="theme-color" content="#ffffff"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #F5F5F7;
  --surface:  #FFFFFF;
  --border:   rgba(0,0,0,0.07);
  --text:     #1C1C1E;
  --text2:    #48484A;
  --text3:    #8E8E93;
  --accent:   #6366F1;
  --green:    #34C759;
  --orange:   #FF9500;
  --red:      #FF3B30;
  --red-s:    rgba(255,59,48,0.10);
  --purple:   #AF52DE;
  --purple-s: rgba(175,82,222,0.10);
  --r:        18px;
  --r-sm:     12px;
  --shadow:   0 1px 2px rgba(0,0,0,0.03),0 4px 20px rgba(0,0,0,0.06);
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bot: env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100svh;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(60px + var(--safe-bot));
}
button{font-family:inherit;border:none;cursor:pointer}

/* ── TOP BAR ── */
.top-bar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,0.90);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:calc(12px + var(--safe-top)) 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.top-bar-title{font-size:22px;font-weight:800;color:var(--text)}
.top-bar-title .dot{color:var(--red)}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-dot.loading{background:var(--orange);animation:pulse 1s infinite}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── FILTERS ── */
.filters{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;flex-direction:column;gap:10px;
}
.period-tabs{display:flex;gap:8px}
.period-tab{
  flex:1;height:38px;border-radius:12px;
  font-size:13px;font-weight:600;color:var(--text3);
  background:var(--bg);border:1.5px solid var(--border);transition:all .15s;
}
.period-tab.active{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 2px 10px rgba(255,59,48,.25)}
.filter-row{display:flex;gap:8px}
.search-inp{
  flex:1;height:40px;padding:0 14px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--bg);
  font-size:14px;color:var(--text);outline:none;font-family:inherit;
}
.search-inp:focus{border-color:var(--accent)}
.prov-sel{
  height:40px;padding:0 10px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--bg);
  font-size:13px;color:var(--text);outline:none;font-family:inherit;
  min-width:130px;max-width:160px;
}
.date-inp{
  height:40px;padding:0 12px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--bg);
  font-size:13px;color:var(--text);outline:none;font-family:inherit;
  flex:1;min-width:0;
}
.date-inp:focus{border-color:var(--accent)}
.date-inp.active{border-color:var(--red);background:#fff5f5}
.period-tab.dim{opacity:.4}

/* ── MIN ITEMS TABS ── */
.min-tabs{display:flex;gap:6px;align-items:center}
.min-label{font-size:11px;font-weight:700;color:var(--text3);white-space:nowrap;letter-spacing:.3px}
.min-tab{
  flex:1;height:34px;border-radius:10px;
  font-size:12px;font-weight:700;color:var(--text3);
  background:var(--bg);border:1.5px solid var(--border);transition:all .15s;
}
.min-tab.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 2px 10px rgba(99,102,241,.28);
}

/* ── STATS BAR ── */
.stats-bar{
  padding:9px 20px;font-size:12px;color:var(--text3);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.stats-bar strong{color:var(--text)}

/* ── CLIENT LIST ── */
.client-list{padding:10px 14px;display:flex;flex-direction:column;gap:10px}

/* ── CLIENT CARD ── */
.client-card{
  background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;
  will-change:transform;
}
.client-card.dismissing{
  animation:slideOutLeft .28s ease-in forwards;
  pointer-events:none;overflow:hidden;
}
@keyframes slideOutLeft{
  to{transform:translateX(-105%);opacity:0;max-height:0;margin-bottom:-10px}
}
.client-header{
  padding:15px 16px;display:flex;align-items:center;gap:12px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;
}
.client-avatar{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:var(--red-s);display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:900;color:var(--red);
}
.client-info{flex:1;min-width:0}
.client-nombre{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-meta{font-size:11px;color:var(--text3);margin-top:2px}
.client-badge{
  background:var(--red);color:#fff;border-radius:99px;
  padding:3px 10px;font-size:12px;font-weight:700;flex-shrink:0;
}
.client-chevron{font-size:11px;color:var(--text3);flex-shrink:0;transition:transform .2s}
.client-card.open .client-chevron{transform:rotate(180deg)}

/* ── DISMISS BTN ── */
.dismiss-btn{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:transparent;color:var(--text3);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;margin-right:-4px;line-height:1;
}
.dismiss-btn:active{background:var(--red-s);color:var(--red)}
.dismiss-btn.restore{color:var(--accent)}
.dismiss-btn.restore:active{background:rgba(99,102,241,.12)}

/* ── ITEMS PANEL ── */
.items-panel{display:none;border-top:1px solid var(--border)}
.client-card.open .items-panel{display:block}
.items-search{
  display:block;margin:11px 14px 7px;
  width:calc(100% - 28px);height:36px;padding:0 12px;
  border-radius:10px;border:1.5px solid var(--border);background:var(--bg);
  font-size:13px;color:var(--text);font-family:inherit;outline:none;
}
.items-search:focus{border-color:var(--accent)}
.items-list{padding:4px 14px 10px;display:flex;flex-direction:column;gap:4px}
.item-row{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;
  background:var(--bg);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background .12s;
}
.item-row.checked{background:var(--red-s)}
.item-check{
  width:21px;height:21px;border-radius:6px;flex-shrink:0;margin-top:1px;
  border:2px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:#fff;transition:all .15s;
}
.item-row.checked .item-check{background:var(--red);border-color:var(--red)}
.item-body{flex:1;min-width:0}
.item-desc{font-size:13px;font-weight:600;color:var(--text);line-height:1.35}
.item-sub{font-size:11px;color:var(--text3);margin-top:2px}
.item-cant{
  font-size:13px;font-weight:800;color:var(--text2);flex-shrink:0;
  background:var(--surface);padding:3px 9px;border-radius:8px;
  border:1px solid var(--border);align-self:center;
}
.item-remp{
  font-size:11px;color:#1d4ed8;margin-top:6px;
  padding:5px 9px;background:#eff6ff;border-radius:8px;
  border-left:3px solid #3b82f6;line-height:1.4;
}
.item-remp-lbl{font-weight:800;display:block;margin-bottom:1px}
.item-remp-val{color:#374151}

/* ── HISTORIAL EXPANDIBLE ── */
.item-hist-btn{
  flex-shrink:0;width:26px;height:26px;border-radius:8px;
  border:1.5px solid var(--border);background:var(--surface);
  font-size:10px;color:var(--text3);align-self:center;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;cursor:pointer;
}
.item-hist-btn.open{background:var(--accent);border-color:var(--accent);color:#fff;transform:rotate(180deg)}
.item-history{
  display:none;margin:2px 14px 4px;
  background:var(--surface);border-radius:12px;
  border:1.5px solid var(--border);overflow:hidden;
}
.item-history.open{display:block}
.hist-title{
  font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;
  color:var(--text3);padding:10px 14px 6px;border-bottom:1px solid var(--border);
}
.hist-row{
  display:grid;grid-template-columns:80px 1fr auto;
  align-items:start;gap:6px;padding:8px 14px;
  border-bottom:1px solid var(--border);font-size:12px;
}
.hist-row:last-child{border-bottom:none}
.hist-fecha{color:var(--text3);font-weight:600;font-size:11px;white-space:nowrap}
.hist-art{color:var(--text);font-weight:500;line-height:1.3}
.hist-remp{
  color:#1d4ed8;font-size:11px;font-weight:600;
  grid-column:1/-1;padding-left:0;padding-top:2px;
}
.hist-sin{color:var(--text3);font-size:11px;font-style:italic;grid-column:1/-1}

/* ── GENERAR PEDIDO BTN ── */
.gen-wrap{padding:10px 14px 14px;border-top:1px solid var(--border)}
.gen-btn{
  width:100%;height:48px;border-radius:14px;
  background:var(--red);color:#fff;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(255,59,48,.28);transition:all .15s;
}
.gen-btn:disabled{opacity:.4;box-shadow:none;cursor:default}
.gen-btn:active:not(:disabled){transform:scale(.98)}

/* ── SECTION CHIPS (en proceso / ignorados) ── */
.sec-group{display:flex;flex-direction:column;gap:8px;padding:2px 0}
.sec-chip{
  display:flex;align-items:center;gap:10px;
  padding:13px 16px;border-radius:14px;
  border:1.5px solid var(--border);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--text2);
  transition:opacity .12s;text-align:left;width:100%;
}
.sec-chip:active{opacity:.7}
.sec-chip.chip-proceso{border-color:#fcd34d;background:#fffbeb;color:#92400e}
.sec-chip.chip-ignorados{border-color:var(--border);background:var(--bg);color:var(--text3)}
.chip-icon{font-size:16px}
.chip-label{flex:1}
.chip-count{
  padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;
  background:var(--text3);color:#fff;
}
.sec-chip.chip-proceso .chip-count{background:#d97706}
.chip-arr{font-size:10px;margin-left:2px;opacity:.6}

/* ── EN PROCESO CARDS ── */
.sec-cards{padding:0 0 8px;display:flex;flex-direction:column;gap:8px}
.ep-card{
  background:#fffbeb;border:1.5px solid #fcd34d;border-radius:14px;
  padding:13px 16px;display:flex;align-items:center;gap:12px;
}
.ep-avatar{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  background:#fef3c7;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#d97706;
}
.ep-info{flex:1;min-width:0}
.ep-nombre{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-meta{font-size:11px;color:#92400e;margin-top:2px}
.ep-badge{
  font-size:11px;font-weight:700;color:#d97706;
  padding:3px 10px;border-radius:99px;background:#fef3c7;
  border:1px solid #fcd34d;flex-shrink:0;
}

/* ── IGNORADOS CARDS ── */
.ign-card{
  background:var(--bg);border:1.5px solid var(--border);border-radius:14px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;
}
.ign-avatar{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:var(--text3);
}
.ign-info{flex:1;min-width:0}
.ign-nombre{font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ign-meta{font-size:11px;color:var(--text3);margin-top:1px}
.ign-restore{
  flex-shrink:0;height:32px;padding:0 12px;border-radius:8px;
  font-size:12px;font-weight:700;color:var(--accent);
  background:none;border:1.5px solid var(--accent);transition:all .15s;
}
.ign-restore:active{background:var(--accent);color:#fff}

/* ── LABEL EN SEARCH ── */
.search-tag{
  display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;
  margin-left:6px;vertical-align:middle;
}
.search-tag.ignorado{background:rgba(0,0,0,.06);color:var(--text3)}
.search-tag.en-proceso{background:#fef3c7;color:#d97706}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:56px 24px}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:17px;font-weight:700;color:var(--text)}
.empty-sub{font-size:14px;color:var(--text3);margin-top:6px}

/* ── SKELETONS ── */
.skel{
  background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal-sheet{
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:20px 20px calc(20px + var(--safe-bot));
  width:100%;max-width:600px;
}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 18px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:5px}
.modal-sub{font-size:13px;color:var(--text3);margin-bottom:18px;line-height:1.4}
.modal-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:6px}
.modal-date{
  width:100%;height:48px;border-radius:14px;
  border:1.5px solid var(--border);background:var(--bg);
  padding:0 16px;font-size:15px;font-family:inherit;
  color:var(--text);outline:none;margin-bottom:18px;
}
.modal-date:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px}
.btn-cancel{flex:1;height:48px;border-radius:14px;background:var(--bg);color:var(--text2);font-size:15px;font-weight:600}
.btn-confirm{
  flex:2;height:48px;border-radius:14px;
  background:var(--red);color:#fff;font-size:15px;font-weight:700;
  box-shadow:0 4px 14px rgba(255,59,48,.28);transition:opacity .15s;
}
.btn-confirm:disabled{opacity:.5;cursor:default}
.modal-suger{
  display:none;align-items:center;gap:8px;margin:-10px 0 16px;
  padding:11px 14px;border-radius:12px;
  background:#f5f0ff;border:1.5px solid #c4b5fd;
  font-size:13px;color:#6d28d9;line-height:1.3;
}
.btn-usar-sug{
  margin-left:auto;flex-shrink:0;height:30px;padding:0 12px;border-radius:8px;
  background:#7c3aed;color:#fff;font-size:12px;font-weight:700;
}

/* ── TOAST ── */
#toastEl{
  position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(12px);
  background:#1C1C1E;color:#fff;border-radius:14px;
  padding:12px 20px;font-size:14px;font-weight:500;
  opacity:0;transition:all .25s;pointer-events:none;z-index:600;
  white-space:nowrap;max-width:calc(100vw - 32px);text-align:center;
}
#toastEl.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,0.90);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;height:calc(56px + var(--safe-bot));padding-bottom:var(--safe-bot);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  font-size:10px;font-weight:600;color:var(--text3);
  text-decoration:none;-webkit-tap-highlight-color:transparent;
}
.nav-item .nav-icon{font-size:21px;line-height:1}
.nav-item.active{color:var(--red)}
</style>
</head>
<body>

<header class="top-bar">
  <div class="top-bar-title"><span class="dot">●</span> Faltantes</div>
  <div id="syncDot" class="sync-dot loading"></div>
</header>

<div class="filters">
  <div class="period-tabs" id="periodTabs">
    <button class="period-tab active" data-days="7">7 días</button>
    <button class="period-tab" data-days="15">15 días</button>
    <button class="period-tab" data-days="30">30 días</button>
  </div>
  <div class="filter-row">
    <input id="fechaEspecifica" class="date-inp" type="date" title="Buscar por fecha de entrega específica"/>
    <select id="provSelect" class="prov-sel">
      <option value="">Todos los proveedores</option>
    </select>
  </div>
  <div class="min-tabs" id="minTabs">
    <span class="min-label">Mín.</span>
    <button class="min-tab" data-min="0">Todos</button>
    <button class="min-tab" data-min="3">3+</button>
    <button class="min-tab active" data-min="6">6+</button>
    <button class="min-tab" data-min="10">10+</button>
  </div>
  <div class="filter-row">
    <input id="searchCliente" class="search-inp" type="search" placeholder="🔍 Cliente, N° o artículo..."/>
  </div>
</div>

<div class="stats-bar" id="statsBar">Cargando...</div>

<div class="client-list" id="clientList">
  <div class="client-card">
    <div class="client-header">
      <div class="client-avatar skel" style="width:44px;height:44px;border-radius:12px"></div>
      <div class="client-info">
        <div class="skel" style="height:15px;width:65%;margin-bottom:7px"></div>
        <div class="skel" style="height:11px;width:40%"></div>
      </div>
    </div>
  </div>
  <div class="client-card">
    <div class="client-header">
      <div class="client-avatar skel" style="width:44px;height:44px;border-radius:12px"></div>
      <div class="client-info">
        <div class="skel" style="height:15px;width:55%;margin-bottom:7px"></div>
        <div class="skel" style="height:11px;width:35%"></div>
      </div>
    </div>
  </div>
  <div class="client-card">
    <div class="client-header">
      <div class="client-avatar skel" style="width:44px;height:44px;border-radius:12px"></div>
      <div class="client-info">
        <div class="skel" style="height:15px;width:70%;margin-bottom:7px"></div>
        <div class="skel" style="height:11px;width:45%"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal generar pedido -->
<div id="genModal" class="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Generar pedido de faltantes</div>
    <div class="modal-sub" id="modalSub">—</div>
    <div class="modal-label">Fecha de entrega</div>
    <input type="date" id="modalFecha" class="modal-date"/>
    <div id="modalSugerencia" class="modal-suger">
      📅 <span id="modalSugerText"></span>
      <button class="btn-usar-sug" onclick="usarFechaSugerida()">Usar esta</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" id="btnConfirm" onclick="confirmarPedido()">Confirmar pedido</button>
    </div>
  </div>
</div>

<div id="toastEl"></div>

<nav class="bottom-nav">
  <a href="./analytics.html" class="nav-item">
    <span class="nav-icon">📊</span>Analytics
  </a>
  <a href="./faltantes.html" class="nav-item active">
    <span class="nav-icon">🔴</span>Faltantes
  </a>
  <a href="./stock.html" class="nav-item">
    <span class="nav-icon">📦</span>Stock
  </a>
</nav>

<script>
// ════════════════════════
// CONFIG
// ════════════════════════

// ════════════════════════
// SUPABASE
// ════════════════════════
async function sbGet(table, params = "") {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {
    headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}` },
    cache: "no-store"
  });
  return r.ok ? r.json() : [];
}

// ════════════════════════
// TOAST
// ════════════════════════
let _tt;
function toast(msg) {
  const el = document.getElementById("toastEl");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove("show"), 3200);
}

// ════════════════════════
// HELPERS
// ════════════════════════
function dateAgo(days) {
  const d = new Date(); d.setDate(d.getDate() - days);
  return d.toISOString().split("T")[0];
}
function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`;
}
function nextWeekday() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d.toISOString().split("T")[0];
}
function escHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function strId(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  return (h >>> 0).toString(36);
}
function setSyncDot(state) {
  document.getElementById("syncDot").className = "sync-dot " + state;
}
function saveIgnorados() {
  localStorage.setItem("faltantes_ignorados", JSON.stringify([...ignorados]));
}

// ════════════════════════
// PROVEEDOR MATCHING
// ════════════════════════
const PROV_OVERRIDE = {
  "entresol":"ENTRE SOL","bio_bag":"BIO BAG","make_fresh":"MAKE FRESH",
  "la_americana":"AMERICANA","la_gauchita":"GAUCHITA","broche_eco":"BROCHE",
  "santamaria_cs":"SANTAMARIA","mis_plast":"MIS PLAST","supy":"SUPER GOMA",
};
function provKeyword(prov) { return PROV_OVERRIDE[prov.id] || prov.nombre.toUpperCase(); }
function matchProv(desc, prov) {
  if (!prov) return true;
  return (desc || "").toUpperCase().includes(provKeyword(prov));
}

// ════════════════════════
// LOAD DATA
// ════════════════════════
async function loadData() {
  setSyncDot("loading");
  try {
    const [items, proveedores, reemplazos, activosFaltante] = await Promise.all([
      sbGet("items_pedido",
        "es_faltante=eq.true" +
        "&faltante_gestionado=neq.true" +
        "&select=id,descripcion,cantidad,created_at,pedidos(cliente_id,cliente_nombre,fecha_entrega,vendedor)" +
        "&order=created_at.desc&limit=2000"
      ),
      sbGet("proveedores", "select=id,nombre&activo=eq.true&order=nombre"),
      sbGet("items_pedido",
        "es_reemplazo=eq.true" +
        "&select=descripcion,cantidad,reemplaza_item_id" +
        "&limit=2000"
      ),
      sbGet("pedidos",
        "es_pedido_faltante=eq.true" +
        "&estado=in.(pendiente,armado,en_facturacion)" +
        "&select=cliente_id,cliente_nombre,numero_diario,estado"
      ),
    ]);

    allItems       = Array.isArray(items)       ? items       : [];
    allProveedores = Array.isArray(proveedores) ? proveedores : [];
    reemplazosMap  = {};
    (Array.isArray(reemplazos) ? reemplazos : []).forEach(r => {
      if (r.reemplaza_item_id) reemplazosMap[r.reemplaza_item_id] = r;
    });
    enProcesoMap = {};
    (Array.isArray(activosFaltante) ? activosFaltante : []).forEach(p => {
      enProcesoMap[p.cliente_id] = p;
    });

    fillProvSelect();
    render();
    setSyncDot("ok");
  } catch(e) {
    console.error(e);
    setSyncDot("err");
    toast("Error al cargar faltantes");
  }
}

// ════════════════════════
// FILTER & GROUP
// ════════════════════════
function getGroups() {
  const search    = document.getElementById("searchCliente").value.trim().toLowerCase();
  const selProv   = allProveedores.find(p => p.id === activeProvId) || null;
  const isSearching = search.length > 0;

  const filtered = allItems.filter(item => {
    const fe = item.pedidos?.fecha_entrega || "";
    if (activeFechaEsp) {
      if (fe !== activeFechaEsp) return false;
    } else {
      if (fe < dateAgo(activeDays)) return false;
    }
    if (!matchProv(item.descripcion, selProv)) return false;
    return true;
  });

  const groups = {};
  filtered.forEach(item => {
    const cid  = item.pedidos?.cliente_id    || "?";
    const cnom = item.pedidos?.cliente_nombre || "Cliente " + cid;
    const fe   = item.pedidos?.fecha_entrega  || "";
    const vend = item.pedidos?.vendedor        || "";
    if (!groups[cid]) groups[cid] = { cliente_id: cid, cliente_nombre: cnom, vendedor: vend, items: [], lastDate: "" };
    groups[cid].items.push(item);
    if (fe > groups[cid].lastDate) {
      groups[cid].lastDate = fe;
      if (vend) groups[cid].vendedor = vend;
    }
  });

  let arr = Object.values(groups).sort((a, b) => b.items.length - a.items.length);

  // Filtro mínimo de artículos (no aplica en modo búsqueda — ahí mostramos todo)
  if (!isSearching && activeMinItems > 0) {
    arr = arr.filter(g => g.items.length >= activeMinItems);
  }

  if (search) {
    arr = arr.filter(g => {
      if (g.cliente_id.includes(search) || g.cliente_nombre.toLowerCase().includes(search)) return true;
      return g.items.some(it => (it.descripcion || "").toLowerCase().includes(search));
    });
    // En búsqueda: mostrar todo (incluido ignorados/en-proceso), con flags para visual
    return {
      main: arr.map(g => ({
        ...g,
        _isIgnored:    ignorados.has(g.cliente_id),
        _isEnProceso:  !!enProcesoMap[g.cliente_id],
      })),
      ignoradosArr: [], enProcesoArr: [],
      total: filtered.length, isSearching: true
    };
  }

  const mainArr      = arr.filter(g => !ignorados.has(g.cliente_id) && !enProcesoMap[g.cliente_id]);
  const enProcesoArr = arr.filter(g =>  !!enProcesoMap[g.cliente_id]);
  const ignoradosArr = arr.filter(g =>  ignorados.has(g.cliente_id) && !enProcesoMap[g.cliente_id]);

  return { main: mainArr, ignoradosArr, enProcesoArr, total: filtered.length, isSearching: false };
}

// ════════════════════════
// RENDER
// ════════════════════════
function render() {
  const { main, ignoradosArr, enProcesoArr, total, isSearching } = getGroups();
  const statsBar = document.getElementById("statsBar");
  const periodoLabel = activeFechaEsp
    ? `entrega ${activeFechaEsp.split("-").reverse().join("/")}`
    : `últimos ${activeDays}d`;

  // Stats
  const totalVisible = isSearching ? main.length : main.length;
  const minLabel = (!isSearching && activeMinItems > 0) ? ` · <span style="color:var(--accent);font-weight:700">${activeMinItems}+ ítems</span>` : "";
  const parts = [];
  if (main.length || isSearching) {
    parts.push(`<strong>${main.length}</strong> cliente${main.length !== 1 ? "s" : ""} · <strong>${total}</strong> faltantes (${periodoLabel})${minLabel}`);
  }
  if (!isSearching) {
    if (enProcesoArr.length) parts.push(`<span style="color:#d97706;font-weight:700">${enProcesoArr.length} en proceso</span>`);
    if (ignoradosArr.length) parts.push(`<span style="color:var(--text3)">${ignoradosArr.length} ignorado${ignoradosArr.length !== 1 ? "s" : ""}</span>`);
  }
  statsBar.innerHTML = parts.length ? parts.join(" · ") : `Sin faltantes · ${periodoLabel}`;

  const list = document.getElementById("clientList");

  const totalAll = main.length + enProcesoArr.length + ignoradosArr.length;
  if (!totalAll) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✅</div>
        <div class="empty-title">Sin faltantes</div>
        <div class="empty-sub">No hay faltantes registrados en los últimos ${activeDays} días</div>
      </div>`;
    return;
  }

  let html = "";

  // ── Sección principal ──
  if (main.length) {
    html += main.map(g => renderCard(g, { isIgnored: g._isIgnored || false, isEnProceso: g._isEnProceso || false })).join("");
  } else if (!isSearching && (enProcesoArr.length || ignoradosArr.length)) {
    html += `
      <div class="empty-state" style="padding:28px 24px">
        <div class="empty-icon" style="font-size:36px">✅</div>
        <div class="empty-title" style="font-size:15px">Todo gestionado</div>
        <div class="empty-sub">Los demás clientes están en proceso o ignorados</div>
      </div>`;
  }

  // ── En proceso ──
  if (enProcesoArr.length) {
    const lbl = { pendiente:"En depósito", armado:"Listo para facturar", en_facturacion:"En facturación" };
    html += `<div class="sec-group">
      <button class="sec-chip chip-proceso" onclick="toggleSection('enProceso')">
        <span class="chip-icon">📋</span>
        <span class="chip-label">En proceso</span>
        <span class="chip-count">${enProcesoArr.length}</span>
        <span class="chip-arr">${showEnProceso ? "▲" : "▼"}</span>
      </button>`;
    if (showEnProceso) {
      html += `<div class="sec-cards">`;
      enProcesoArr.forEach(g => {
        const ped = enProcesoMap[g.cliente_id];
        html += `
          <div class="ep-card">
            <div class="ep-avatar">${escHtml(g.cliente_nombre.charAt(0))}</div>
            <div class="ep-info">
              <div class="ep-nombre">${escHtml(g.cliente_nombre)}</div>
              <div class="ep-meta">Pedido N°${ped.numero_diario} · ${lbl[ped.estado] || ped.estado}</div>
            </div>
            <div class="ep-badge">${g.items.length} falt.</div>
          </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  }

  // ── Ignorados ──
  if (ignoradosArr.length) {
    html += `<div class="sec-group">
      <button class="sec-chip chip-ignorados" onclick="toggleSection('ignorados')">
        <span class="chip-icon">🙈</span>
        <span class="chip-label">Ignorados</span>
        <span class="chip-count">${ignoradosArr.length}</span>
        <span class="chip-arr">${showIgnorados ? "▲" : "▼"}</span>
      </button>`;
    if (showIgnorados) {
      html += `<div class="sec-cards">`;
      ignoradosArr.forEach(g => {
        html += `
          <div class="ign-card">
            <div class="ign-avatar">${escHtml(g.cliente_nombre.charAt(0))}</div>
            <div class="ign-info">
              <div class="ign-nombre">${escHtml(g.cliente_nombre)}</div>
              <div class="ign-meta">N° ${g.cliente_id} · ${g.items.length} faltante${g.items.length !== 1 ? "s" : ""} · Último: ${fmtDate(g.lastDate)}</div>
            </div>
            <button class="ign-restore" onclick="desigNorarCliente('${escHtml(g.cliente_id)}')">Mostrar</button>
          </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  }

  html += `<div style="height:10px"></div>`;
  list.innerHTML = html;

  // Restaurar abierto
  if (openClientId) {
    const c = document.getElementById("cc-" + openClientId);
    if (c) { c.classList.add("open"); updateGenBtn(openClientId); }
  }

  // Listeners en tarjetas principales
  main.forEach(g => {
    const c = document.getElementById("cc-" + g.cliente_id);
    if (!c) return;
    c.querySelector(".client-header").addEventListener("click", e => {
      if (e.target.closest(".dismiss-btn")) return;
      if (c.classList.contains("open")) {
        c.classList.remove("open"); openClientId = null;
      } else {
        document.querySelectorAll(".client-card.open").forEach(x => x.classList.remove("open"));
        c.classList.add("open"); openClientId = g.cliente_id;
        updateGenBtn(g.cliente_id);
      }
    });
    // Restaurar checkboxes
    const sel = selMap[g.cliente_id] || {};
    Object.keys(sel).forEach(dk => {
      const row = document.getElementById(`ir-${g.cliente_id}-${dk}`);
      const chk = document.getElementById(`ic-${g.cliente_id}-${dk}`);
      if (row) { row.classList.add("checked"); if (chk) chk.textContent = "✓"; }
    });
  });
}

// ════════════════════════
// RENDER CARD
// ════════════════════════
function renderCard(g, { isIgnored = false, isEnProceso = false } = {}) {
  const agg = aggregate(g.items);
  const initial = g.cliente_nombre.charAt(0).toUpperCase();
  const tags = [
    isIgnored   ? `<span class="search-tag ignorado">ignorado</span>`   : "",
    isEnProceso ? `<span class="search-tag en-proceso">en proceso</span>` : "",
  ].join("");
  const metaExtra = tags ? ` · ${tags}` : "";
  const dismissIsRestore = isIgnored;

  return `
    <div class="client-card" id="cc-${g.cliente_id}" data-cid="${escHtml(g.cliente_id)}">
      <div class="client-header">
        <div class="client-avatar">${escHtml(initial)}</div>
        <div class="client-info">
          <div class="client-nombre">${escHtml(g.cliente_nombre)}</div>
          <div class="client-meta">N° ${g.cliente_id} · Último faltante: ${fmtDate(g.lastDate)}${metaExtra}</div>
        </div>
        <div class="client-badge">${g.items.length}</div>
        <div class="client-chevron">▼</div>
        <button class="dismiss-btn ${dismissIsRestore ? "restore" : ""}"
          data-dismiss="${escHtml(g.cliente_id)}"
          title="${dismissIsRestore ? "Volver a mostrar" : "Ignorar cliente"}"
        >${dismissIsRestore ? "👁" : "×"}</button>
      </div>
      <div class="items-panel">
        <input class="items-search" type="search" placeholder="🔍 Filtrar productos..."
               id="is-${g.cliente_id}" oninput="filterItems('${g.cliente_id}')"/>
        <div class="items-list" id="il-${g.cliente_id}">
          ${renderItems(agg, g.cliente_id)}
        </div>
        <div class="gen-wrap">
          <button class="gen-btn" id="gb-${g.cliente_id}" disabled
            data-cid="${escHtml(g.cliente_id)}"
            data-nom="${escHtml(g.cliente_nombre)}"
            data-vend="${escHtml(g.vendedor || '')}">
            🚀 Generar pedido
          </button>
        </div>
      </div>
    </div>`;
}

// ════════════════════════
// IGNORE / UNIGNORE
// ════════════════════════
function ignorarCliente(clienteId) {
  ignorados.add(clienteId);
  saveIgnorados();
  // Si hay una tarjeta visible, animarla antes de re-render
  const card = document.getElementById("cc-" + clienteId);
  if (card && !card._isIgnored) {
    card.classList.add("dismissing");
    // Si estaba abierta, cerrarla
    if (openClientId === clienteId) openClientId = null;
    setTimeout(() => render(), 300);
  } else {
    render();
  }
}

function desigNorarCliente(clienteId) {
  ignorados.delete(clienteId);
  saveIgnorados();
  render();
  toast("Cliente vuelto a la lista principal");
}

// ════════════════════════
// TOGGLE SECCIONES
// ════════════════════════
function toggleSection(sec) {
  if (sec === "enProceso") showEnProceso = !showEnProceso;
  if (sec === "ignorados") showIgnorados = !showIgnorados;
  render();
}

// ════════════════════════
// SWIPE TO DISMISS
// ════════════════════════
let _sw = null;

function initSwipe() {
  document.addEventListener("touchstart", e => {
    const card = e.target.closest(".client-card");
    if (!card || card.classList.contains("dismissing")) return;
    _sw = {
      x0: e.touches[0].clientX,
      y0: e.touches[0].clientY,
      cid: card.dataset.cid,
      card,
      locked: false,
    };
  }, { passive: true });

  document.addEventListener("touchmove", e => {
    if (!_sw || _sw.locked) return;
    const dx = e.touches[0].clientX - _sw.x0;
    const dy = Math.abs(e.touches[0].clientY - _sw.y0);
    // Si el desplazamiento vertical supera al horizontal → es scroll, no swipe
    if (dy > Math.abs(dx) + 8) { _sw = null; return; }
    if (dx < -6) {
      const tx = Math.max(-130, dx);
      _sw.card.style.transform = `translateX(${tx}px)`;
      _sw.card.style.opacity   = String(Math.max(0.2, 1 + tx / 130));
    }
  }, { passive: true });

  document.addEventListener("touchend", e => {
    if (!_sw) return;
    const dx = e.changedTouches[0].clientX - _sw.x0;
    if (dx < -80) {
      // Swipe confirmado
      _sw.card.style.transition = "transform .22s ease-out, opacity .22s ease-out";
      _sw.card.style.transform  = "translateX(-110%)";
      _sw.card.style.opacity    = "0";
      const cid = _sw.cid;
      _sw = null;
      setTimeout(() => ignorarCliente(cid), 220);
    } else {
      // Cancelar — volver a posición
      _sw.card.style.transition = "transform .2s ease, opacity .2s ease";
      _sw.card.style.transform  = "";
      _sw.card.style.opacity    = "";
      setTimeout(() => {
        if (_sw?.card) { _sw.card.style.transition = ""; }
      }, 220);
      _sw = null;
    }
  }, { passive: true });
}

// ════════════════════════
// AGGREGATE
// ════════════════════════
function aggregate(items) {
  const map = {};
  items.forEach(it => {
    const key = (it.descripcion || "").trim().toUpperCase();
    if (!key) return;
    if (!map[key]) map[key] = { descripcion: key, totalCant: 0, veces: 0, lastDate: "", itemIds: [], ocurrencias: [] };
    const cant = Number(it.cantidad) || 1;
    map[key].totalCant += cant;
    map[key].veces++;
    if (it.id) map[key].itemIds.push(it.id);
    const d = it.pedidos?.fecha_entrega || "";
    if (d > map[key].lastDate) map[key].lastDate = d;
    map[key].ocurrencias.push({ fecha: d, cantidad: cant, itemId: it.id || null });
  });
  Object.values(map).forEach(g => g.ocurrencias.sort((a, b) => (b.fecha > a.fecha ? 1 : -1)));
  return Object.values(map).sort((a, b) => b.veces - a.veces || b.totalCant - a.totalCant);
}

function renderHistorial(ocurrencias, dk, clienteId) {
  const rows = ocurrencias.map(oc => {
    const remp = oc.itemId ? reemplazosMap[oc.itemId] : null;
    return `
      <div class="hist-row">
        <span class="hist-fecha">${fmtDate(oc.fecha)}</span>
        <span class="hist-art">× ${oc.cantidad}</span>
        ${remp
          ? `<span class="hist-remp">↩ Enviaron: ${escHtml(remp.descripcion)} × ${remp.cantidad}</span>`
          : `<span class="hist-sin">Sin reemplazo registrado</span>`}
      </div>`;
  }).join("");
  return `
    <div class="item-history" id="ih-${clienteId}-${dk}">
      <div class="hist-title">Historial de faltantes</div>
      ${rows}
    </div>`;
}

function renderItems(aggArr, clienteId) {
  return aggArr.map(it => {
    const dk = strId(it.descripcion);
    const vLabel = it.veces > 1 ? `${it.veces}× faltó · ` : "";
    const rDescs = [...new Set(
      (it.itemIds || []).filter(id => reemplazosMap[id]).map(id => reemplazosMap[id].descripcion)
    )];
    const rempHtml = rDescs.length
      ? `<div class="item-remp">
           <span class="item-remp-lbl">↩ Reemplazado con:</span>
           <span class="item-remp-val">${rDescs.map(escHtml).join(" · ")}</span>
         </div>`
      : "";
    const histHtml = (it.ocurrencias?.length > 1 || rDescs.length)
      ? renderHistorial(it.ocurrencias, dk, clienteId) : "";
    const histBtn = histHtml
      ? `<button class="item-hist-btn" data-hid="${clienteId}-${dk}" title="Ver historial">▼</button>`
      : "";
    return `
      <div class="item-row" id="ir-${clienteId}-${dk}"
           data-cid="${escHtml(String(clienteId))}" data-dk="${escHtml(dk)}"
           data-desc="${escHtml(it.descripcion)}" data-cant="${it.totalCant}"
           data-ids="${it.itemIds.join(',')}">
        <div class="item-check" id="ic-${clienteId}-${dk}"></div>
        <div class="item-body">
          <div class="item-desc">${escHtml(it.descripcion)}</div>
          <div class="item-sub">${vLabel}Último: ${fmtDate(it.lastDate)}</div>
          ${rempHtml}
        </div>
        <div class="item-cant">× ${it.totalCant}</div>
        ${histBtn}
      </div>
      ${histHtml}`;
  }).join("");
}

// ════════════════════════
// ITEM FILTER
// ════════════════════════
function filterItems(clienteId) {
  const q = (document.getElementById(`is-${clienteId}`)?.value || "").trim().toLowerCase();
  document.querySelectorAll(`#il-${clienteId} .item-row`).forEach(row => {
    const desc = row.querySelector(".item-desc")?.textContent?.toLowerCase() || "";
    row.style.display = q && !desc.includes(q) ? "none" : "flex";
  });
}

// ════════════════════════
// CHECKBOX SELECTION
// ════════════════════════
function toggleItem(clienteId, dk, descripcion, cantidad, itemIds) {
  if (!selMap[clienteId]) selMap[clienteId] = {};
  const sel = selMap[clienteId];
  const row = document.getElementById(`ir-${clienteId}-${dk}`);
  const chk = document.getElementById(`ic-${clienteId}-${dk}`);
  if (sel[dk]) {
    delete sel[dk];
    row?.classList.remove("checked");
    if (chk) chk.textContent = "";
  } else {
    sel[dk] = { descripcion, cantidad, item_ids: Array.isArray(itemIds) ? itemIds.filter(Boolean) : [] };
    row?.classList.add("checked");
    if (chk) chk.textContent = "✓";
  }
  updateGenBtn(clienteId);
}

function toggleHistory(hid) {
  const panel = document.getElementById("ih-" + hid);
  const btn   = document.querySelector(`.item-hist-btn[data-hid="${hid}"]`);
  if (!panel) return;
  const open = panel.classList.toggle("open");
  if (btn) btn.classList.toggle("open", open);
}

function updateGenBtn(clienteId) {
  const btn = document.getElementById(`gb-${clienteId}`);
  if (!btn) return;
  const n = Object.keys(selMap[clienteId] || {}).length;
  btn.disabled = n === 0;
  btn.textContent = n > 0 ? `🚀 Generar pedido (${n} ítem${n !== 1 ? "s" : ""})` : "🚀 Generar pedido";
}

// ════════════════════════
// MODAL
// ════════════════════════
let _submitting    = false;
let _fechaSugerida = "";
const DAYS_ES = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

function openModal(clienteId, clienteNombre, vendedor) {
  if (!clienteId || clienteId === "?") { toast("Cliente sin número registrado"); return; }
  const items = Object.values(selMap[clienteId] || {});
  if (!items.length) { toast("Seleccioná al menos un ítem"); return; }
  pendingOrder = { clienteId, clienteNombre, vendedor: vendedor || "", items };
  document.getElementById("modalSub").textContent =
    `${items.length} ítem${items.length !== 1 ? "s" : ""} · ${clienteNombre}`;
  document.getElementById("modalFecha").value = nextWeekday();
  document.getElementById("modalSugerencia").style.display = "none";
  _fechaSugerida = "";
  document.getElementById("genModal").classList.add("open");
  sugerirFechaEntrega(clienteId);
}

async function sugerirFechaEntrega(clienteId) {
  try {
    const historicos = await sbGet("pedidos",
      `cliente_id=eq.${encodeURIComponent(clienteId)}` +
      `&select=fecha_entrega&es_pedido_faltante=eq.false` +
      `&order=fecha_entrega.desc&limit=20`
    );
    if (!historicos.length) return;
    const dayCount = {};
    historicos.forEach(p => {
      if (!p.fecha_entrega) return;
      const dow = new Date(p.fecha_entrega + "T12:00:00").getDay();
      dayCount[dow] = (dayCount[dow] || 0) + 1;
    });
    const sorted = Object.entries(dayCount).sort((a, b) => b[1] - a[1]);
    if (!sorted.length) return;
    const [bestDow, bestCount] = sorted[0];
    const confidence = Math.round(bestCount / historicos.length * 100);
    if (confidence < 50) return;
    const dow  = parseInt(bestDow);
    const next = new Date();
    next.setDate(next.getDate() + 1);
    while (next.getDay() !== dow) next.setDate(next.getDate() + 1);
    const nextISO = next.toISOString().split("T")[0];
    _fechaSugerida = nextISO;
    document.getElementById("modalSugerText").textContent =
      `Suele recibir los ${DAYS_ES[dow]} (${confidence}% de sus pedidos) → ${fmtDate(nextISO)}`;
    document.getElementById("modalSugerencia").style.display = "flex";
    document.getElementById("modalFecha").value = nextISO;
  } catch(e) { console.error("sugerirFechaEntrega:", e); }
}

function usarFechaSugerida() {
  if (_fechaSugerida) document.getElementById("modalFecha").value = _fechaSugerida;
}

function closeModal() {
  document.getElementById("genModal").classList.remove("open");
  pendingOrder = null; _fechaSugerida = "";
}

async function confirmarPedido() {
  if (!pendingOrder || _submitting) return;
  const fecha = document.getElementById("modalFecha").value;
  if (!fecha) { toast("Elegí una fecha de entrega"); return; }
  _submitting = true;
  const btn = document.getElementById("btnConfirm");
  btn.disabled = true; btn.textContent = "Enviando...";
  const { clienteId, clienteNombre, vendedor, items } = pendingOrder;
  try {
    const res = await fetch(`${WORKER}/crear-pedido-faltante`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cliente_id: clienteId, cliente_nombre: clienteNombre, vendedor, fecha_entrega: fecha, items }),
    });
    const data = await res.json();
    if (data.ok) {
      closeModal();
      toast(`✅ Pedido N°${data.numero_diario || ""} generado para depósito`);
      delete selMap[clienteId];
      updateGenBtn(clienteId);
      document.querySelectorAll(`[id^="ir-${clienteId}-"]`).forEach(r => r.classList.remove("checked"));
      document.querySelectorAll(`[id^="ic-${clienteId}-"]`).forEach(c => c.textContent = "");
      // Recargar para que el cliente pase a "en proceso"
      await loadData();
    } else {
      toast("❌ " + (data.error || "Error al crear el pedido"));
    }
  } catch(e) {
    console.error(e);
    toast("❌ Error de conexión al generar el pedido");
  } finally {
    _submitting = false;
    btn.disabled = false; btn.textContent = "Confirmar pedido";
  }
}

// ════════════════════════
// EVENT LISTENERS
// ════════════════════════
document.getElementById("periodTabs").addEventListener("click", e => {
  const btn = e.target.closest(".period-tab");
  if (!btn) return;
  document.querySelectorAll(".period-tab").forEach(b => b.classList.remove("active","dim"));
  btn.classList.add("active");
  activeDays = parseInt(btn.dataset.days);
  activeFechaEsp = "";
  document.getElementById("fechaEspecifica").value = "";
  document.getElementById("fechaEspecifica").classList.remove("active");
  openClientId = null; render();
});

document.getElementById("fechaEspecifica").addEventListener("change", e => {
  activeFechaEsp = e.target.value || "";
  const tabs = document.querySelectorAll(".period-tab");
  if (activeFechaEsp) {
    tabs.forEach(b => { b.classList.remove("active"); b.classList.add("dim"); });
    e.target.classList.add("active");
  } else {
    e.target.classList.remove("active");
    tabs.forEach(b => {
      b.classList.remove("dim");
      if (parseInt(b.dataset.days) === activeDays) b.classList.add("active");
    });
  }
  openClientId = null; render();
});

document.getElementById("searchCliente").addEventListener("input", () => {
  openClientId = null; render();
});

document.getElementById("provSelect").addEventListener("change", e => {
  activeProvId = e.target.value;
  openClientId = null; render();
});

document.getElementById("minTabs").addEventListener("click", e => {
  const btn = e.target.closest(".min-tab");
  if (!btn) return;
  document.querySelectorAll(".min-tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeMinItems = parseInt(btn.dataset.min);
  openClientId = null; render();
});

document.getElementById("genModal").addEventListener("click", e => {
  if (e.target === document.getElementById("genModal")) closeModal();
});

// Delegado único para toda la lista
document.getElementById("clientList").addEventListener("click", e => {
  // 1. Botón dismiss / restore
  const dismissBtn = e.target.closest(".dismiss-btn");
  if (dismissBtn) {
    e.stopPropagation();
    const cid = dismissBtn.dataset.dismiss;
    if (ignorados.has(cid)) {
      desigNorarCliente(cid);
    } else {
      ignorarCliente(cid);
    }
    return;
  }

  // 2. Botón historial ▼
  const histBtn = e.target.closest(".item-hist-btn");
  if (histBtn) { toggleHistory(histBtn.dataset.hid); return; }

  // 3. Item row → toggle selección
  const row = e.target.closest(".item-row");
  if (row) {
    const { cid, dk, desc, cant, ids } = row.dataset;
    if (cid && dk) toggleItem(cid, dk, desc, Number(cant), ids ? ids.split(",").filter(Boolean) : []);
    return;
  }

  // 4. Botón Generar pedido
  const btn = e.target.closest(".gen-btn");
  if (btn && !btn.disabled) {
    const { cid, nom, vend } = btn.dataset;
    openModal(cid, nom, vend);
  }
});

// ════════════════════════
// INIT
// ════════════════════════
initSwipe();
loadData();
</script>
